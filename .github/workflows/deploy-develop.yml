name: Deploy to Development

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ✅ Validar sintaxis
        run: python -m py_compile app.py vercel_app.py

      - name: 🧪 Verificar imports
        run: python -c "from app import app; print('✅ App carga correctamente')"

      - name: ✅ Validación completada
        run: |
          echo "🎉 Validación completada exitosamente"
          echo "🚀 Vercel desplegará automáticamente a desarrollo"
          echo "🌐 URL: https://ver-ip-mberisvil-mauricios-projects-7d741bf6.vercel.app"
