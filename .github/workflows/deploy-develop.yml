name: Deploy to Development

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy-develop:
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://ver-ip-mberisvil-mauricios-projects-7d741bf6.vercel.app/
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ✅ Validar sintaxis
        run: python -m py_compile app.py

      - name: 🚀 Desplegar a Vercel (Development)
        run: |
          npm install --global vercel
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: ✅ Despliegue completado
        run: |
          echo "🎉 Despliegue a DESARROLLO completado"
          echo "🌐 URL: https://ver-ip-mberisvil-mauricios-projects-7d741bf6.vercel.app"
          echo "📊 Base de datos: Neon Development"
