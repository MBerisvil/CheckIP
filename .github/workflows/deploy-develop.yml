name: Deploy to Development

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy-develop:
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://ver-ip-mberisvil-mauricios-projects-7d741bf6.vercel.app/
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ✅ Validar sintaxis
        run: python -m py_compile app.py

      - name: 🚀 Desplegar a Vercel (Development)
        uses: amondnet/vercel-action@v25
        env:
          # Variables de entorno para DESARROLLO
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          API_MONITOR_KEY: ${{ secrets.API_MONITOR_KEY_DEV }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: ✅ Despliegue completado
        run: |
          echo "🎉 Despliegue a DESARROLLO completado"
          echo "🌐 URL: https://ver-ip-mberisvil-mauricios-projects-7d741bf6.vercel.app"
          echo "📊 Base de datos: Neon Development"
