name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 6'  # Sábado 3:00 AM UTC

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: 🔍 Linter
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: ✅ Validar sintaxis
        run: python -m py_compile app.py

  deploy-production:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: production
      url: https://ver-ip.vercel.app
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🚧 Activar modo mantenimiento
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --local-config=vercel.maintenance.json'
        continue-on-error: true

      - name: ⏳ Esperar propagación
        run: sleep 10

      - name: 🚀 Desplegar a Vercel (Production)
        run: |
          npm install --global vercel
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: ✅ Despliegue completado
        if: success()
        run: |
          echo "🎉 Despliegue a PRODUCCIÓN completado"
          echo "🌐 URL: https://ver-ip.vercel.app"
          echo "📊 Base de datos: Neon Production"
          echo "⏱️ Fecha: $(date)"
