name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  
  # Despliegue programado (configurable)
  schedule:
    # ⚠️ PRUEBA: Se ejecutará a las 12:22 UTC (9:22 AM Argentina)
    - cron: '22 12 * * *'  # Todos los días a las 12:22 UTC
    # Después de probar, cambiar a tu horario deseado:
    # - cron: '0 3 * * 6'  # Sábado 3:00 AM UTC = Sábado 12:00 AM Argentina
  
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno de despliegue'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  # Job de pruebas automáticas
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Linter (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Ejecutar pruebas
        run: |
          # Si tienes tests, descomenta la siguiente línea
          # pytest --cov=. --cov-report=xml

      - name: Validar sintaxis Python
        run: |
          python -m py_compile app.py

  # Job de despliegue manual a producción
  deploy-production:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://verificar-ip.vercel.app
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: 🚧 Activar modo mantenimiento
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --local-config=vercel.maintenance.json'
        continue-on-error: true

      - name: ⏳ Esperar propagación de mantenimiento
        run: sleep 10

      - name: 🚀 Desplegar nueva versión a Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: ✅ Verificar despliegue exitoso
        if: success()
        run: echo "🎉 Despliegue completado y sitio restaurado"

  # Job de despliegue programado a producción
  deploy-scheduled:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'schedule'
    environment:
      name: production
      url: https://verificar-ip.vercel.app
    steps:
      - name: Checkout código (rama main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 📅 Notificar inicio de despliegue programado
        run: |
          echo "🕐 Iniciando despliegue programado a producción"
          echo "📅 Fecha: $(date)"
          echo "🌿 Rama: main"

      - name: 🚧 Activar modo mantenimiento
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod --local-config=vercel.maintenance.json'
        continue-on-error: true

      - name: ⏳ Esperar propagación de mantenimiento
        run: sleep 10

      - name: 🚀 Desplegar nueva versión a Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: ✅ Notificar despliegue exitoso
        if: success()
        run: |
          echo "✅ Despliegue programado completado exitosamente"
          echo "🚀 Sitio actualizado: https://verificar-ip.vercel.app"
          echo "⏱️ Tiempo total: ${{ job.duration }} segundos"

  # Job de despliegue a staging (opcional)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    environment:
      name: staging
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Desplegar a Vercel (Staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
